services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: splitwise_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/splitwise_dev?schema=public"
      JWT_SECRET: "docker-dev-secret-change-in-production"
      JWT_REFRESH_SECRET: "docker-dev-refresh-secret-change-in-production"
      PORT: "3000"
    depends_on:
      - db

volumes:
  postgres-data:
